name: Provisionar clientes

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: provisionamento-clientes
  cancel-in-progress: false

jobs:
  processar-fila:
    if: ${{ vars.GC_PROVISIONING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: '2.75.0'
      - name: Processar próxima instalação
        run: node scripts/provision-client.mjs
        env:
          GC_CONTROL_PROJECT_REF: ${{ vars.GC_CONTROL_PROJECT_REF }}
          GC_SUPABASE_ORGANIZATION: ${{ vars.GC_SUPABASE_ORGANIZATION }}
          GC_CLOUDFLARE_ACCOUNT_ID: ${{ vars.GC_CLOUDFLARE_ACCOUNT_ID }}
          GC_ALLOW_PAID_PROJECTS: ${{ vars.GC_ALLOW_PAID_PROJECTS }}
          GC_TEAM_PILOT_EMAIL: ${{ secrets.GC_TEAM_PILOT_EMAIL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GC_CLIENT_SMTP_JSON: ${{ secrets.GC_CLIENT_SMTP_JSON }}

